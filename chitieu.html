<!-- Hoàng Làm -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiêu</title>
    <link rel="stylesheet" href="chitieu.css" />
  </head>
  <body>
    <main class="chiTieuContainer">
      <header class="chiTieuHeader">
        <p class="chiTieuLabel">Quản lý chi tiêu</p>
        <h1>Chi tiêu</h1>
      </header>

      <section class="tongKetChiTieu">
        <div class="tongKetItem tongSoDu">
          <span class="labelTongKet">Tổng số dư</span>
          <strong id="tongSoDu">0₫</strong>
        </div>
        <div class="tongKetItem">
          <span class="labelTongKet">Tổng chi tiêu</span>
          <strong id="tongChiTieu">0₫</strong>
        </div>
      </section>

      <section class="chiTieuCard">
        <form class="formChiTieu" id="formChiTieu">
          <div class="nhomNhap">
            <label for="noiDung">Nội dung</label>
            <input
              id="noiDung"
              type="text"
              placeholder="Ví dụ: ăn cơm, tiền nhà, xăng xe..."
              required
            />
          </div>

          <div class="nhomNhap">
            <label for="soTien">Số tiền</label>
            <input
              id="soTien"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Ví dụ: 100000, 200000..."
              required
            />
          </div>

          <div class="nhomNhap">
            <label for="ngayChiTieu">Ngày</label>
            <input id="ngayChiTieu" type="date" required />
          </div>

          <button type="submit">Thêm chi tiêu</button>
        </form>
      </section>

      <section class="bangChiTieu">
        <h2>Danh sách giao dịch</h2>
        <table>
          <thead>
            <tr>
              <th>Nội dung</th>
              <th>Số tiền</th>
              <th>Ngày</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="danhSachChiTieu"></tbody>
        </table>
      </section>
    </main>
    <script src="chitieu.js"></script>
  </body>
</html>
