<!-- Hoàng Làm -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiêu</title>
  </head>
  <body>
    <h1>Chi tiêu</h1>
    <form>
      <div>
        <label>Nội dung</label>
        <input type="text" placeholder="Ví dụ: ăn cơm, tiền nhà, xăng xe..." />
      </div>
      <div>
        <label>Số tiền</label>
        <input type="number" placeholder="Ví dụ: 100000, 200000..." />
      </div>
       <div>
      <p>
        <label>Ngày:</label>
        <input type="date" />
      </p>
    </div>
      <button type="submit">Thêm Chi Tiêu</button>
    </div>
    <h2>Danh sách giao dịch</h2>
    <table>
      <thead>
        <tr>
          <th>Nội dung</th>
          <th>Số tiền</th>
          <th>Ngày</th>
        </tr>
      </thead>
      <tbody>
        <!-- Nội dung ở đây -->
      </tbody>
  </body>
</html>
