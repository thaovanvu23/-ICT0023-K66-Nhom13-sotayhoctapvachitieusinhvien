<!-- Vân Làm -->

<!-- PHẦN QUẢN LÝ DEADLINE / HỌC TẬP -->
<section id="hoc-tap-section" class="card">
  <h2>Học tập & Deadline</h2>
  <p class="section-desc">Quản lý bài tập, đồ án và thời hạn nộp bài của các môn học.</p>

  <!-- Form thêm / chỉnh sửa deadline -->
  <form id="deadline-form" class="form-container">
    <div class="form-grid">
      <div class="form-group">
        <label for="mon-hoc">Môn học <span class="required">*</span></label>
        <input type="text" id="mon-hoc" placeholder="VD: Lập trình Web, Cấu trúc dữ liệu..." required>
      </div>

      <div class="form-group">
        <label for="viec-can-lam">Việc cần làm <span class="required">*</span></label>
        <input type="text" id="viec-can-lam" placeholder="VD: Nộp bài tập lớn Git, Bài thực hành số 3..." required>
      </div>

      <div class="form-group">
        <label for="han-chot">Hạn chót (Deadline) <span class="required">*</span></label>
        <input type="datetime-local" id="han-chot" required>
      </div>

      <div class="form-group">
        <label for="muc-do">Mức độ ưu tiên</label>
        <select id="muc-do">
          <option value="binh-thuong">Bình thường</option>
          <option value="quan-trọng">Quan trọng</option>
          <option value="khan-cap">Khẩn cấp</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Thêm Deadline</button>
      <button type="reset" class="btn btn-secondary">Làm mới</button>
    </div>
  </form>

  <!-- Thanh công cụ tìm kiếm và lọc deadline -->
  <div class="toolbar">
    <div class="filter-group">
      <select id="filter-trang-thai">
        <option value="tat-ca">Tất cả trạng thái</option>
        <option value="chua-hoan-thành">Chưa hoàn thành</option>
        <option value="da-hoan-thành">Đã hoàn thành</option>
      </select>
    </div>
    <div class="search-group">
      <input type="text" id="search-deadline" placeholder="Tìm kiếm môn học, nội dung...">
    </div>
  </div>

  <!-- Bảng hiển thị danh sách deadline -->
  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>Môn học</th>
          <th>Việc cần làm</th>
          <th>Hạn chót</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="deadline-list">
        <!-- Dữ liệu mẫu khi chưa có bài tập hoặc để test giao diện -->
        <!-- 
        <tr>
          <td>Lập trình Web</td>
          <td>Hoàn thành layout trang Deadline</td>
          <td>2026-10-15 23:59</td>
          <td><span class="badge warning">Chưa hoàn thành</span></td>
          <td>
            <button class="btn-action btn-complete">Hoàn thành</button>
            <button class="btn-action btn-delete">Xóa</button>
          </td>
        </tr>
        -->
        <tr>
          <td colspan="5" class="empty-row">
            Chưa có deadline nào. Thêm việc cần làm ở form trên.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
