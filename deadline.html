<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Deadline - Nhóm 13</title>
    <link rel="stylesheet" href="deadline.css" />
  </head>
  <body>
    <!-- PHẦN HTML -->
    <section id="hoc-tap-section">
      <h2>Học tập & Deadline</h2>
      <p class="section-desc">Quản lý bài tập, đồ án và thời hạn nộp bài.</p>

      <form id="deadline-form" class="form-container">
        <div class="form-grid">
          <div class="form-group">
            <label for="mon-hoc">Môn học <span class="required">*</span></label>
            <input
              type="text"
              id="mon-hoc"
              placeholder="VD: Lập trình Web"
              required
            />
          </div>
          <div class="form-group">
            <label for="viec-can-lam"
              >Việc cần làm <span class="required">*</span></label
            >
            <input
              type="text"
              id="viec-can-lam"
              placeholder="VD: Nộp bài tập Git"
              required
            />
          </div>
          <div class="form-group">
            <label for="han-chot"
              >Hạn chót <span class="required">*</span></label
            >
            <input type="datetime-local" id="han-chot" required />
          </div>
          <div class="form-group">
            <label for="muc-do">Mức độ</label>
            <select id="muc-do">
              <option value="binh-thuong">Bình thường</option>
              <option value="khan-cap">Khẩn cấp</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Thêm Deadline</button>
      </form>

      <div class="toolbar">
        <select id="filter-trang-thai">
          <option value="tat-ca">Tất cả trạng thái</option>
          <option value="chua-hoan-thanh">Chưa hoàn thành</option>
          <option value="da-hoan-thanh">Đã hoàn thành</option>
        </select>
        <input
          type="text"
          id="search-deadline"
          placeholder="Tìm kiếm môn học..."
        />
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Môn học</th>
              <th>Việc cần làm</th>
              <th>Hạn chót</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="deadline-list">
            <tr>
              <td colspan="5" class="empty-row">Chưa có deadline nào.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </body>
</html>
