<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tổng Quan</title>
    <link rel="stylesheet" href="tongquan.css" />
  </head>
  <body>
    <main class="tongQuanPage">
      <article class="tongQuanCard" aria-labelledby="tongQuanTitle">
        <header class="tongQuanHeader">
          <p class="tongQuanEyebrow">SỔ TAY SINH VIÊN</p>
          <h1 id="tongQuanTitle">Tổng quan</h1>
        </header>

        <dl class="tongQuanStats">
          <div class="tongQuanStat">
            <dt>Số dư</dt>
            <dd>0 <span>VNĐ</span></dd>
          </div>
          <div class="tongQuanStat">
            <dt>Deadline gần nhất</dt>
            <dd>Chưa có</dd>
          </div>
          <div class="tongQuanStat">
            <dt>Số môn đang học</dt>
            <dd>0 <span>môn</span></dd>
          </div>
          <div class="tongQuanStat">
            <dt>Số giao dịch trong tháng</dt>
            <dd>0 <span>giao dịch</span></dd>
          </div>
        </dl>
      </article>
    </main>
  </body>
</html>
